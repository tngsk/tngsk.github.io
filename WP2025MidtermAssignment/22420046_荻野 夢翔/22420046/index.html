<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Best Musics 2025</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playwrite+US+Trad+Guides&family=Sacramento&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="sacramento-regular">
      <span style="color: rgb(225, 64, 96)">M</span>y BEST
      <span style="color: rgb(225, 64, 96)">M</span>usics<br />
      <span style="color: rgb(225, 64, 96)">2025</span>
      <div class="intro-container">
        <p>自分だけの、今年を代表する２０曲。</p>
      </div>
      <nav class="header-nav">
        <a
          href="https://youtube.com/playlist?list=PLtXKTzlElqHckB4BQBwgByByrx9LM8kDZ"
          class="icon-link"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img src="img/YouTube.png" alt="YouTube" />
        </a>
        <a
          href="https://open.spotify.com/playlist/7Bg1VOOQlMOIrlXlsGeBu1"
          class="icon-link"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img src="img/Spotify.png" alt="Spotify" />
        </a>
        <a
          href="https://x.com/home"
          class="icon-link"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img src="img/X.png" alt="X" />
        </a>
        <a
          href="https://www.instagram.com/ogiu2089/"
          class="icon-link"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img src="img/Instagram.png" alt="Instagram" />
        </a>
      </nav>
    </header>
    <!-- //////////////////////////////////////////////////// -->
    <main>
      <div class="music-unit">
        <article class="card">
          <div class="split">
            <div class="jacket">
              <img
                src="img/AiScReam.png"
                alt="愛♡スクリ～ム！"
                class="jacket-img"
              />
            </div>
            <div class="info">
              <div class="blue-box">
                <h3>愛♡スクリ～ム！</h3>
                <h4>AiScReam</h4>
              </div>
              <div class="blue-box">
                <p>
                  「チョコミント よりも あ・な・た」でおなじみ。<br />あなたはどのフレイバーが好き？
                </p>
              </div>
            </div>
          </div>
        </article>
        <nav class="side-nav">
          <a
            href="https://youtu.be/L1mFVp9IM9c"
            class="icon-link"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="img/YouTube.png" alt="YouTube" />
          </a>
          <a
            href="https://open.spotify.com/intl-ja/track/2BBIUV8wIBbqc7HXObzdgH"
            class="icon-link"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="img/Spotify.png" alt="Spotify" />
          </a>
          <a
            href="https://x.com/LoveLive_staff"
            class="icon-link"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="img/X.png" alt="X" />
          </a>
        </nav>
      </div>
      <!-- //////////////////////////////////////////////////// -->
      <div class="music-unit reverse">
        <article class="card">
          <div class="split reverse">
            <div class="jacket">
              <img src="img/Saikai.png" alt="再会" class="jacket-img" />
            </div>
            <div class="info">
              <div class="blue-box">
                <h3>再会</h3>
                <h4>Vaundy</h4>
              </div>
              <div class="blue-box">
                <p>
                  不気味さと爽やかさが交互にやってくる曲。<br />あなたはどんな「夏」を感じますか？
                </p>
              </div>
            </div>
          </div>
        </article>
        <nav class="side-nav">
          <a
            href="https://youtu.be/WcaSSvtHFeM"
            class="icon-link"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="img/YouTube.png" alt="YouTube" />
          </a>
          <a
            href="https://open.spotify.com/intl-ja/track/7c1icp8E7aYG90vA3wo3Se"
            class="icon-link"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="img/Spotify.png" alt="Spotify" />
          </a>
          <a
            href="https://x.com/vaundy_engawa"
            class="icon-link"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="img/X.png" alt="X" />
          </a>
        </nav>
      </div>
    </main>

    <footer>© 2025 OginoYû</footer>
  </body>
</html>
