<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>おすすめバンド</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css\style.css">
</head>
<body>
    <header class="sacramento-regular">
        <h1>BlueMash</h1> <p class="subhead">儚い歌詞と心に響くパフォーマンスが特徴の4人組ロックバンド。</p>
    </header>

    <main>
        <img class="main-image" src="img/buruma.jpg" alt="BlueMash の集合写真">

        <div class="card yoko-layout"> <section class="item">
                <h3>バンド名</h3>
                <p>BlueMash</p>
            </section>
            <section class="item">
                <h3>ジャンル</h3>
                <p>ロック</p>
            </section>
            <section class="item">
                <h3>特徴</h3>
                <p>儚い歌詞と心に響くパフォーマンスが特徴の4人組ロックバンド。</p>
            </section>
        </div>

        <div class="card yoko-layout members"> <section class="item member">
                <h4>優斗</h4>
                <p>Gt. / Vo.</p>
            </section>
            <section class="item member">
                <h4>げんげん</h4>
                <p>Gt.</p>
            </section>
            <section class="item member">
                <h4>荒川ソラ</h4>
                <p>Ba.</p>
            </section>
            <section class="item member">
                <h4>マサヒロ</h4>
                <p>Dr.</p>
            </section>
        </div>

        <div class="card">
            <h2>おすすめ曲</h2>
            
            <section class="song stack-small">
                <h4>海岸線</h4>
                <p>激しくも誰かのために歌う一曲。</p>
                <p><a href="https://youtu.be/eWoIgD2Yo4A?si=RG6C2JSznsyAReLw" target="_blank" rel="noopener">動画を見る</a></p>
            </section>

            <section class="song stack-small">
                <h4>東京ラストティーン</h4>
                <p>十代の自分を等身大で表現した一曲。</p>
                <p><a href="https://youtu.be/RfdSTBcO18I?si=B_py_UJGeeNIHact" target="_blank" rel="noopener">動画を見る</a></p>
            </section>
        </div>
    </main>
</body>
</html>
