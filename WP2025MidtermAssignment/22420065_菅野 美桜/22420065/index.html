                <h2>コンセプトギャラリー -旅の面影-</h2>
                <div class="photo-grid">

                    <figure class="photo-item Hokkaido">
                        <figcaption><strong>Concept 1: 北海道</strong> - シマエナガと海の色合い</figcaption>
                        <div class="image-pair">
                            <img src="img\Hokkai.jpg" alt="函館山の100万ドルの夜景">
                            <img src="img\shimaenaga.jpg" alt="シマエナガの概念ネイル">
                        </div>
                    </figure>
                    
                    <!-- 秋保 -->
                    <figure class="photo-item Akiu">
                        <figcaption><strong>Concept 2: 秋保</strong> - 万華鏡の煌めき</figcaption>
                        <div class="image-pair">
                            <img src="img\Akiu.jpg" alt="秋保万華鏡美術館" >
                            <img src="img\blue-shine.jpg" alt="万華鏡がもつ輝きの概念ネイル">
                        </div>
                    </figure>
                    
                    <!-- セブンティーンライブ -->
                    <figure class="photo-item live">
                        <figcaption><strong>Concept 3: 推しのライブ</strong> - 夜の美術館コンセプトと、グループカラー</figcaption>
                        <div class="image-pair">

                            <img src="img\seventeen.jpg" alt="ベースカラーがローズクォーツとセレニティの概念ネイル" >
                        </div>
                    </figure>
                    
                    <!-- 金華山 -->
                    <figure class="photo-item MtKinka">
                        <figcaption><strong>Concept 4: 金華山</strong> - ヒガンバナと荒れる波の不穏な雰囲気</figcaption>
                        <div class="image-pair">
                            <img src="img\Mt.kinka.jpg" alt="ヒガンバナと荒波の風景" >
                            <img src="img\pink-flower.jpg" alt="花とピンクの概念ネイル">
                        </div>
                    </figure>
